server.port=80
# Maxfiy qiymatlar (DB_PASSWORD, JWT_SECRET) env yoki git ga kirmaydigan secrets.properties faylidan olinadi
spring.config.import=optional:classpath:secrets.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_app
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
#spring.jpa.hibernate.ddl-auto=create
#spring.sql.init.mode=always
spring.jpa.show-sql=true

spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.max-file-size=100MB
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

application-description=@project.description@
application-version=@project.version@
logging.level.org.springframework.boot.autoconfigure=ERROR

server.error.include-stacktrace=on_param
server.error.include-exception=false
server.error.include-message=always
server.error.include-binding-errors=always


# JWT (HS512 uchun kamida 64 baytli base64 kalit) - JWT_SECRET env yoki secrets.properties dan olinadi
jwt.secret=${JWT_SECRET}
jwt.expire-time-ms=86400000

# Spring Data Page obyektlarini barqaror JSON formatda qaytarish
spring.data.web.pageable.serialization-mode=via_dto

# Jackson 3 parametr nomlari orqali Lombok @AllArgsConstructor ni tanlaydi va yo'q maydonlar null bo'lib qoladi.
# O'chirib qo'yamiz: DTO'lar bo'sh konstruktor + setter orqali yaratiladi (Jackson 2 dagi kabi)
spring.jackson.mapper.detect-parameter-names=false
